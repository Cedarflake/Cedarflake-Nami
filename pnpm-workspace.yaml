packages:
  - "apps/*"
  - "packages/*"
  - "plugins/*/*"

overrides:
  "@eslint/eslintrc>ajv": "6.14.0"
  "eslint>ajv": "6.14.0"
  "@vercel/static-config>ajv": "8.20.0"
  "@tootallnate/once": "2.0.1"
  brace-expansion: "5.0.12"
  esbuild: "0.28.1"
  js-yaml: "4.3.2"
  minimatch: "10.2.3"
  "@vercel/node>path-to-regexp": "6.3.0"
  "@vercel/remix-builder>path-to-regexp": "6.3.0"
  "@vercel/backends>path-to-regexp": "8.4.0"
  "@vercel/express>path-to-regexp": "8.4.0"
  "@vercel/fun>path-to-regexp": "8.4.0"
  "@vercel/hono>path-to-regexp": "8.4.0"
  postcss: "8.5.23"
  preact: "10.28.2"
  "shell-quote@<1.11.0": "1.11.0"
  smol-toml: "1.6.1"
  srvx: "0.11.16"
  tar: "7.5.19"
  "@vercel/blob>undici": "6.27.0"
  "@vercel/node>undici": "6.27.0"
  miniflare>undici: "7.29.1"
  uuid: "11.1.1"
  ws: "8.21.0"
  sharp: "0.35.5"
  # VitePress 1.6.4 uses plugin-vue 5.2, which supports Vite 6.
  vite: "6.4.3"
  "nanoid@<3.3.18": "3.3.18"
  browserslist: "4.28.7"
  source-map-js: "1.2.2"

onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@swc/core"
  - esbuild
  - sharp
  - unrs-resolver
  - workerd

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: true
  workerd: true

patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
